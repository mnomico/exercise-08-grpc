syntax = "proto3";

package noderegistry;

// NodeRegistry keeps track of nodes in a distributed cluster:
// registration, listing, lookup, and removal.
service NodeRegistry {
  rpc Register(RegisterRequest) returns (NodeResponse);
  rpc List(Empty) returns (NodeList);
  rpc Get(GetRequest) returns (NodeResponse);
  rpc Delete(DeleteRequest) returns (Empty);
}

message Empty {}

message RegisterRequest {
  string name = 1;
  string address = 2;
  int32 port = 3;
  map<string, string> metadata = 4;
}

message GetRequest {
  string id = 1;
}

message DeleteRequest {
  string id = 1;
}

message NodeResponse {
  string id = 1;
  string name = 2;
  string address = 3;
  int32 port = 4;
  map<string, string> metadata = 5;
  string status = 6;
  string registered_at = 7;
}

message NodeList {
  repeated NodeResponse nodes = 1;
}
